site_name: Checkerboard fMRI Task
docs_dir: docs
site_dir: build_output/docs_site
theme:
  name: material
  logo: assets/images/checkerboard_icon.png
  favicon: assets/images/checkerboard_icon.png
  features:
    - navigation.footer

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

nav:
  - Home: index.md
  - For Users:
      - Getting Started: getting-started.md
  - For Contributors:
      - Development & Building: development.md
      - Golden Rules: golden-rules.md
      - AI Style Guide: ai-style-guide.md
  - License: license.md
