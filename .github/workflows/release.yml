name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm reads the version from the tag; a shallow clone has no tags.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Inno Setup
        run: choco install innosetup -y

      # Same script as a local build: icon, exe, config copy, installer. With no .venv it
      # uses the runner's python, and names the installer after the tag (e.g. -v0.1.0.exe).
      - name: Build exe and installer
        run: .\build.ps1 -Full

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: build_output/installer/*.exe
          generate_release_notes: true
