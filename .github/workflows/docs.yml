name: Docs

on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "LICENSE.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned to the versions that build locally: MkDocs 2.0 drops the plugin and theme
      # system mkdocs-material relies on, so an unpinned install could break the site.
      - name: Install docs dependencies
        run: pip install "mkdocs==1.6.1" "mkdocs-material==9.7.7"

      - name: Deploy to gh-pages
        run: mkdocs gh-deploy --force
