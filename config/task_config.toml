# Checkerboard fMRI task configuration.
#
# Basic working defaults: confirm every value against the literature / your protocol and
# your scanner/projector before collecting data. Check the file with:
#     checkerboard_fmri_task --check-config
#
# Units: seconds (_s), hertz (_hz), degrees of visual angle (_deg), centimetres (_cm).
# Luminance values are digital grey levels from 0.0 (black) to 1.0 (white), NOT cd/m².

[scanner]
# pyglet key name the scanner sends as its trigger (LSHIFT = Left Shift).
trigger_key = "LSHIFT"
# Triggers discarded as dummy acquisitions. The task starts on trigger number
# dummy_triggers + 1. Every trigger, including dummies, is logged.
dummy_triggers = 5

[paradigm]
# Which block comes first: "on" (checkerboard) or "off" (fixation only).
first_block = "off"
on_block_s = 20.0               # duration of each ON block
off_block_s = 20.0              # duration of each OFF block
total_duration_s = 200.0        # task length, measured from the start trigger

[stimulus]
# Contrast reversals per second (one reversal = one black/white swap; a full
# flicker cycle is two reversals). 7.5 divides 60 Hz into whole frames.
reversal_rate_hz = 7.5
n_wedges = 24                   # angular segments (must be even)
n_rings = 10                    # radial segments
inner_radius_deg = 0.5          # radius of the blank centre
outer_radius_deg = 8.0          # radius of the checkerboard
ring_spacing = "log"            # "linear" (equal widths) or "log" (scaled with eccentricity)
# Michelson contrast of the checks around mean_luminance. 1.0 with a mean of 0.5 gives
# black (0.0) and white (1.0) checks.
contrast = 1.0
mean_luminance = 0.5
# Screen grey level during OFF blocks and around the checkerboard. 0.0 matches the
# black checks (mean_luminance * (1 - contrast)).
background_luminance = 0.0

[fixation]
shape = "dot"                   # "dot" or "cross"
size_deg = 0.3                  # dot diameter or cross arm length
color = [1.0, 0.0, 0.0]         # RGB, each 0.0-1.0
# line_width_deg = 0.05         # required for "cross" only

[display]
viewing_distance_cm = 60.0      # eye to screen (via the mirror for a projector)
screen_width_cm = 53.0          # width of the visible image on the screen
# Optional: refresh rate the projector should run at. If set, the measured rate is
# compared against it and a mismatch is logged as a warning.
expected_refresh_hz = 60.0
# A frame interval longer than this many expected frame intervals counts as dropped.
dropped_frame_factor = 1.5
